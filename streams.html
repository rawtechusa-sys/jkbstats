  if (!boxes) return null;
  const x = ev.offsetX, y = ev.offsetY;
  for (const b of boxes) if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) return b;
  return null;
}

// Navigate the shell to the Donors tab focused on a given donor, in the SAME page
// (mirrors donors.html's jumpToStream): stash the user, ask the shell to switch
// tabs; the donors iframe reloads and reads 'selected-donor' on load (that
// sessionStorage key is donors.html's contract -- rename both together).
function jumpToDonor(user) {
  if (!user) return;
  try { sessionStorage.setItem('selected-donor', user); } catch (e) {}
  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type: 'navigate', slug: 'donors' }, '*'); return; } catch (e) {}
  }
  window.location.href = 'index.html#donors';
}

// A themed doughnut for the contributor / type breakdowns. dataArr values are USD;
// the tooltip shows "<label>: $<amount> (<pct>%)". Returns the Chart (or null).
// opts (optional): { linkable: Set<label>, onLabelClick: fn(label) } makes the
// listed labels clickable (used to link contributor usernames to their donors page).
function buildPie(canvasId, labels, dataArr, colors, opts) {
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const t = THEMES[localStorage.getItem('goblin-theme') || 'green'] || THEMES.green;
  const total = dataArr.reduce((s, v) => s + v, 0);

  // Size the canvas to its content: pad each side for the leader plus the widest
  // (untruncated) label so the fit-content card hugs the chart and nothing clips.
  let maxLabel = 0;
  labels.forEach((l, i) => { if (dataArr[i]) maxLabel = Math.max(maxLabel, measurePieLabel(String(l))); });
  const sidePad = Math.ceil(PIE_LEADER + maxLabel + PIE_GAP + 2);
  const wrap = el.parentElement;
  if (wrap) {
    wrap.style.width = (PIE_DIAM + 2 * sidePad) + 'px';
    wrap.style.height = (PIE_DIAM + PIE_TOP_PAD + PIE_BOT_PAD) + 'px';
  }

  const chart = new Chart(el, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: dataArr, backgroundColor: colors, borderWidth: 0 }] },
    plugins: [pieOutLabels],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // A live refresh redraws in place: no spin-in (see quietRender).
      animation: quietRender ? false : { duration: 1000 },
      layout: { padding: { left: sidePad, right: sidePad, top: PIE_TOP_PAD, bottom: PIE_BOT_PAD } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.tooltipBg, titleColor: t.tooltipTitle, bodyColor: t.tooltipBody,
          borderColor: t.tooltipBorder, borderWidth: 1,
          callbacks: {
            label: (ctx) => {
              const v = ctx.parsed || 0;
              const pct = total ? (v / total * 100).toFixed(1) : '0.0';
              return `${ctx.label}: $${v.toFixed(2)} (${pct}%)`;
            },
          },
        },
      },
    },
  });

  // Clickable labels: the plugin underlines linkable ones and records hitboxes.
  if (opts && opts.onLabelClick) {
    chart.$linkable = opts.linkable || null;
    el.addEventListener('mousemove', (ev) => {
      const b = hitPieLabel(chart, ev);
      el.style.cursor = (b && b.linkable) ? 'pointer' : 'default';
    });
    el.addEventListener('mouseleave', () => { el.style.cursor = 'default'; });
    el.addEventListener('click', (ev) => {
      const b = hitPieLabel(chart, ev);
      if (b && b.linkable) opts.onLabelClick(b.label);
    });
  }
  return chart;
}

function buildChart(snapshots, donations, hasYTViewers, hasActiveYT, hasYTChat, moderation = []) {
  if (currentChart) {
    if (currentChart.$stopZoomAnim) currentChart.$stopZoomAnim();   // no easing frame may outlive its chart
    currentChart.destroy();
    currentChart = null;
  }

  const ctx = document.getElementById('streamChart');
  if (!ctx) return;

  const snapshotData = snapshots.map(s => ({
    x:          s.ts * 1000,
    yt:         s.youtube ?? null,
    ytMpm:      s.youtube_messages_per_minute ?? null,
    ytActive:   s.active_youtube_chatters     ?? null,
  }));

  // Bucket donations onto the snapshot index grid so the bar dataset shares the
  // same index space as the line series. This keeps mode:'index' tooltips
  // coherent (every dataset's index i is the same timestamp) and prevents a
  // sparse donation bar from hijacking the nearest-index lookup. Per-donation
  // detail is preserved in the donation log table below.
  const donationByIndex = new Array(snapshotData.length).fill(0);
  if (snapshotData.length > 0) {
    for (const d of donations) {
      const dx = d.ts * 1000;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < snapshotData.length; i++) {
        const dist = Math.abs(snapshotData[i].x - dx);
        if (dist < best) { best = dist; nearest = i; }
        else if (dist > best) break;  // x is sorted ascending; distance is convex
      }
      donationByIndex[nearest] += (d.amount_usd || 0);
    }
  }
  // Running total across the snapshot grid: the donation line is the cumulative
  // money raised up to each point, so it climbs with each donation and plateaus
  // at the stream total. Every index carries a value, making the line solid.
  const donationCumByIndex = new Array(snapshotData.length).fill(0);
  {
    let running = 0;
    for (let i = 0; i < snapshotData.length; i++) {
      running += donationByIndex[i];
      donationCumByIndex[i] = running;
    }
  }
  const hasDonations = donations.length > 0 && snapshotData.length > 0;

  // Members: the same nearest-index bucketing and running total as the donation
  // series, but counting heads instead of money (memberCount: 1 per membership,
  // N per gift, 0 for everything else).
  const memberByIndex = new Array(snapshotData.length).fill(0);
  if (snapshotData.length > 0) {
    for (const d of donations) {
      const count = memberCount(d);
      if (count <= 0) continue;
      const dx = d.ts * 1000;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < snapshotData.length; i++) {
        const dist = Math.abs(snapshotData[i].x - dx);
        if (dist < best) { best = dist; nearest = i; }
        else if (dist > best) break;  // x is sorted ascending; distance is convex
      }
      memberByIndex[nearest] += count;
    }
  }
  const memberCumByIndex = new Array(snapshotData.length).fill(0);
  {
    let running = 0;
    for (let i = 0; i < snapshotData.length; i++) {
      running += memberByIndex[i];
      memberCumByIndex[i] = running;
    }
  }
  const hasMembers = memberCumByIndex.length > 0 && memberCumByIndex[memberCumByIndex.length - 1] > 0;

  // Time label for the chart x-axis ticks and tooltip, in the active timezone
  // (Goblin/Local/UTC -- see config.js withTZ). Chart.js reformats every tick on every
  // pan/zoom frame, so cache the Intl formatter (rebuilt only when the TZ changes) and
  // memoize per millisecond rather than constructing a formatter on each call.
  let _dtfTz = false, _dtf = null;
  const _dtMemo = new Map();
  function fmtET(ms) {
    const tz = getTimeZone();
    if (tz !== _dtfTz) {
      _dtfTz = tz;
      _dtf = new Intl.DateTimeFormat('en-US', withTZ({ hour: 'numeric', minute: '2-digit' }));
      _dtMemo.clear();
    }
    let s = _dtMemo.get(ms);
    if (s === undefined) { s = _dtf.format(new Date(ms)); _dtMemo.set(ms, s); }
    return s;
  }

  // Cached + memoized integer tick formatters for the y-axes. Same reason as fmtET:
  // ticks are reformatted every frame, and a fresh Intl.NumberFormat per call (which is
  // what Number.toLocaleString() does) dominated the pan profile. One shared formatter
  // (default locale, matching the old toLocaleString) plus a per-value memo.
  const _tickNumFmt = new Intl.NumberFormat();
  const _numMemo = new Map();
  const fmtTickInt = v => { let s = _numMemo.get(v); if (s === undefined) { s = _tickNumFmt.format(v); _numMemo.set(v, s); } return s; };
  const _dollarMemo = new Map();
  const fmtTickDollar = v => { let s = _dollarMemo.get(v); if (s === undefined) { s = '$' + _tickNumFmt.format(v); _dollarMemo.set(v, s); } return s; };

  const t = THEMES[localStorage.getItem('goblin-theme') || 'green'] || THEMES.green;
  const datasets = [];

  // ── Viewer series ──
  // A null viewer sample means the collector had no data for that minute, not
  // zero viewers. Nulls stay null and spanGaps bridges them; the bridged
  // segment is drawn dashed (gapDash) so interpolation is visible as such.
  const gapDash = { borderDash: c => (c.p0.skip || c.p1.skip) ? [5, 5] : undefined };

  // One platform, so colour encodes the METRIC (and matches that metric's axis):
  // viewers cyan, active chatters grey dotted, msg/min blue dashed.
  if (hasYTViewers && snapshotData.length > 0) {
    datasets.push({
      label: DS.YT_VIEWERS,
      hidden: hiddenDatasets.has(DS.YT_VIEWERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.yt })),
      type: 'line',
      borderColor: '#40c4ff',
      backgroundColor: 'rgba(64,196,255,0.08)',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: true, spanGaps: true, segment: gapDash,
      yAxisID: 'yViewers',
    });
  }

  // ── Active chatter series ──
  // Built from the full snapshotData (null where missing) so indices stay
  // aligned with the viewer series; spanGaps bridges the nulls visually.
  if (hasActiveYT) {
    datasets.push({
      label: DS.YT_ACTIVE_CHATTERS,
      hidden: hiddenDatasets.has(DS.YT_ACTIVE_CHATTERS),
      data: snapshotData.map(s => ({ x: s.x, y: s.ytActive })),
      type: 'line',
      borderColor: '#909090',
      backgroundColor: 'transparent',
      borderWidth: 2, borderDash: [2, 2],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yActiveChatters',
    });
  }

  // ── Donations (cumulative) ──
  if (hasDonations) {
    datasets.push({
      label: DS.DONATIONS,
      hidden: hiddenDatasets.has(DS.DONATIONS),
      data: snapshotData.map((s, i) => ({
        x: s.x,
        y: donationCumByIndex[i],
      })),
      type: 'line',
      borderColor: '#e8c020',
      backgroundColor: 'rgba(232,192,32,0.12)',
      borderWidth: 2,
      pointRadius: 0, pointHoverRadius: 4,
      // Stepped, not interpolated: the total is flat between donations and jumps
      // at the snapshot that first includes the money ('after' puts the riser at
      // that snapshot's x, where the donation was bucketed).
      tension: 0,
      stepped: 'after',
      fill: true,
      yAxisID: 'yDonations',
    });
  }

  // ── Members (cumulative count) ──
  // Stepped like the donation total, on its own count axis -- it is heads, not
  // dollars, and the two scales have nothing to do with each other.
  if (hasMembers) {
    datasets.push({
      label: DS.MEMBERS,
      hidden: hiddenDatasets.has(DS.MEMBERS),
      data: snapshotData.map((s, i) => ({
        x: s.x,
        y: memberCumByIndex[i],
      })),
      type: 'line',
      borderColor: 'rgb(255,120,200)',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0,
      stepped: 'after',
      fill: false,
      yAxisID: 'yMembers',
    });
  }

  // ── Chat rate series ──
  // Built from the full snapshotData so indices align with the other series
  // (mode:'index' tooltips match by index, not by x). Missing samples map to
  // null and are bridged with spanGaps; the tooltip label fills them in.
  if (hasYTChat && snapshotData.length > 0) {
    datasets.push({
      label: DS.YT_CHAT,
      hidden: hiddenDatasets.has(DS.YT_CHAT),
      data: snapshotData.map(s => ({ x: s.x, y: s.ytMpm })),
      type: 'line',
      borderColor: '#82b1ff',
      backgroundColor: 'transparent',
      borderWidth: 2, borderDash: [8, 3],
      pointRadius: 0, pointHoverRadius: 4,
      tension: 0.3, fill: false, spanGaps: true,
      yAxisID: 'yChatRate',
    });
  }

  // For a series with gaps (null y at some indices), return the value at idx,
  // or the nearest non-null value by index distance. Lets the tooltip show every
  // stat at the hovered position even where that stat has no exact sample.
  function nearestValue(dataArr, idx) {
    const at = dataArr[idx];
    if (at && at.y != null && !Number.isNaN(at.y)) return at.y;
    for (let d = 1; d < dataArr.length; d++) {
      const lo = dataArr[idx - d];
      if (lo && lo.y != null && !Number.isNaN(lo.y)) return lo.y;
      const hi = dataArr[idx + d];
      if (hi && hi.y != null && !Number.isNaN(hi.y)) return hi.y;
    }
    return null;
  }

  // Is at least one dataset for this axis group present in this stream AND not hidden by the user?
  function axisHasVisibleDs(labels) {
    return labels.some(l => datasets.some(d => d.label === l) && !hiddenDatasets.has(l));
  }

  // Moderation marker visibility (persisted; default on). Closed over by the
  // moderationMarks plugin below and toggled from the legend.
  let showModeration = localStorage.getItem('stream-chart-moderation') !== '0';

  // With no viewer line (backfilled stream) the chatters axis carries the
  // horizontal grid instead, so the plot is never left without one.
  const chattersGrid = hasYTViewers ? { drawOnChartArea: false } : { color: t.chartGrid };

  currentChart = new Chart(ctx, {
    type: 'bar',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // Data is already pre-sorted, unique-by-x {x,y} (the shared snapshot grid),
      // so skip Chart.js's per-update parse/sort pass entirely.
      parsing: false,
      normalized: true,
      interaction: { mode: 'index', intersect: false },
      // A live refresh redraws in place: no intro animation (see restoreView).
      animation: quietRender ? false : { duration: 400 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: t.tooltipBg,
          borderColor: t.tooltipBorder,
          borderWidth: 1,
          titleColor: t.tooltipTitle,
          bodyColor: t.tooltipBody,
          titleFont: { family: "'Share Tech Mono', monospace", size: 11 },
          bodyFont:  { family: "'Lora', serif", size: 13 },
          // Draw each row's key as a line matching the dataset's color AND dash
          // pattern (see lineKeyCanvas) so the tooltip key mirrors the chart line.
          usePointStyle: true,
          boxWidth: 26,
          boxHeight: 10,
          boxPadding: 6,
          // Order tooltip rows to match the legend on top of the chart.
          itemSort: (a, b) => LEGEND_ORDER.indexOf(a.dataset.label) - LEGEND_ORDER.indexOf(b.dataset.label),
          // Donations only show when that bucket actually has a donation.
          // Continuous series always show -- the label callback fills gaps with
          // the nearest sample, so every stat appears whenever the tooltip is up.
          filter: item => {
            if (item.dataset.yAxisID === 'yDonations') {
              return item.parsed.y != null && !Number.isNaN(item.parsed.y);
            }
            return true;
          },
          callbacks: {
            title: items => fmtET(items[0].parsed.x),
            // Key = a short line in the dataset's color + dash pattern.
            labelPointStyle: item => ({
              pointStyle: lineKeyCanvas(item.dataset.borderColor, item.dataset.borderDash),
              rotation: 0,
            }),
            label: item => {
              const isDon = item.dataset.yAxisID === 'yDonations';
              let y = item.parsed.y;
              if (!isDon && (y == null || Number.isNaN(y))) {
                y = nearestValue(item.dataset.data, item.dataIndex);
              }
              if (y == null || Number.isNaN(y)) return null;
              switch (item.dataset.label) {
                case DS.DONATIONS:          return ` $${y.toFixed(2)} raised so far`;
                case DS.MEMBERS:            return ` ${Math.round(y).toLocaleString()} members`;
                case DS.YT_CHAT:            return ` chat: ${y.toFixed(1)} mpm`;
                case DS.YT_ACTIVE_CHATTERS: return ` active chatters: ${Math.round(y).toLocaleString()}`;
                default:                    return ` ${Math.round(y).toLocaleString()} viewers`;
              }
            }
          }
        },
        // X-axis zoom/pan. Wheel + pinch zoom and drag-to-pan, clamped to the
        // stream's own time range. Double-click the chart to reset (see below).
        zoom: {
          pan: {
            enabled: true, mode: 'x',
            // Sync $xWindow to the live x-scale so smoothYFit refits the y-axes to the
            // panned region (the scrollbar drag does the same at line ~1560). Without
            // this the y-scale stays pinned to the pre-drag window.
            onPan: ({ chart }) => { syncXWindow(chart); chart.$updateScrollbar && chart.$updateScrollbar(); },
          },
          zoom: {
            // Wheel zoom is handled manually in setupScrollbar so it can be eased
            // and less sensitive; pinch stays on the plugin for touch devices.
            wheel: { enabled: false },
            pinch: { enabled: true },
            mode: 'x',
            onZoom: ({ chart }) => { syncXWindow(chart); chart.$updateScrollbar && chart.$updateScrollbar(); },
          },
          limits: { x: { min: 'original', max: 'original' } },
        },
      },
      scales: {
        x: {
          type: 'linear',
          offset: false, // override the bar-chart default so lines span edge-to-edge (no slot padding that grows when zoomed)
          grid: { color: t.chartGrid },
          ticks: {
            color: t.chartTick,
            font: { family: "'Share Tech Mono', monospace", size: 15 },
            callback: v => fmtET(v),
            maxTicksLimit: 10,
          }
        },
        yViewers: {
          type: 'linear',
          position: 'left',
          display: axisHasVisibleDs([DS.YT_VIEWERS]),
          bounds: 'data', // keep smoothYFit's exact min/max; 'ticks' (default) would round them to tick steps and re-snap the scale
          grid: { color: t.chartGrid },
          ticks: {
            color: '#40c4ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 6,
          },
          title: {
            display: true,
            text: 'viewers',
            color: '#40c4ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yActiveChatters: {
          type: 'linear',
          position: 'left',
          display: axisHasVisibleDs([DS.YT_ACTIVE_CHATTERS]),
          bounds: 'data',
          grid: chattersGrid,
          ticks: {
            color: '#909090',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'chatters',
            color: '#909090',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yDonations: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.DONATIONS]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#e8c020',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickDollar),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: { display: false },
        },
        yMembers: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.MEMBERS]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: 'rgb(255,120,200)',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'members',
            color: 'rgb(255,120,200)',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
        yChatRate: {
          type: 'linear',
          position: 'right',
          display: axisHasVisibleDs([DS.YT_CHAT]),
          bounds: 'data',
          grid: { drawOnChartArea: false },
          ticks: {
            color: '#82b1ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
            callback: intTick(fmtTickInt),
            precision: 0,
            maxTicksLimit: 5,
          },
          title: {
            display: true,
            text: 'msg / min',
            color: '#82b1ff',
            font: { family: "'Share Tech Mono', monospace", size: 14 },
          },
        },
      }
    },
    plugins: [{
      // Override each y-axis's auto-fit with the distance-weighted envelope so the
      // scale moves continuously during x zoom/pan instead of snapping. Runs on every
      // update (incl. the 'none'-mode zoomScale frames), reads state and writes
      // scale.min/max in place -- no re-entrant update(), so no animation loop.
      id: 'smoothYFit',
      afterDataLimits(chart, args) {
        const scale = args.scale;
        if (!scale || scale.axis !== 'y') return;       // leave the x-axis to the zoom plugin
        if (scale.options.display === false) return;     // skip hidden axes
        const ext = smoothYExtent(chart, scale.id);      // scale.id === 'yViewers', etc.
        if (!ext) return;
        scale.min = ext.min;
        scale.max = ext.max;
      },
    }, {
      // Moderation markers, drawn ON TOP of the data: a dotted red line per
      // event with a square head on the bottom edge, and a "Removed: name"
      // label beside it. Labels stack left to right into the first of three
      // bottom rows with horizontal space; one that collides in every row is
      // dropped (its line is already drawn). A dark plate backs each label --
      // the foot of the chart is where the data lines are busiest.
      id: 'moderationMarks',
      afterDatasetsDraw(chart) {
        if (!showModeration || !moderation.length) return;
        const xs = chart.scales.x;
        const { left, right, top, bottom } = chart.chartArea;
        const ctx = chart.ctx;
        const HEAD = 6, ROWS = [6, 20, 34], GAP = 4, LINE_H = 11;
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, right - left, bottom - top);
        ctx.clip();

        for (const ev of moderation) {
          const x = xs.getPixelForValue(ev.ts * 1000);
          if (x < left || x > right) continue;
          ctx.strokeStyle = `rgba(${MOD_ACCENT},0.8)`;
          ctx.lineWidth = 2;
          ctx.setLineDash([2, 3]);
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = `rgba(${MOD_ACCENT},0.9)`;
          ctx.fillRect(x - HEAD / 2, bottom - HEAD, HEAD, HEAD);
          ctx.strokeStyle = 'rgba(0,0,0,0.55)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x - HEAD / 2, bottom - HEAD, HEAD, HEAD);
        }

        ctx.font = '11px "Share Tech Mono", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        const rows = ROWS.map(() => []);
        for (const ev of moderation) {
          const at = xs.getPixelForValue(ev.ts * 1000);
          if (at < left || at > right) continue;
          const text = modLabel(ev);
          const width = ctx.measureText(text).width;
          const x = (at + 4 + width > right) ? at - 4 - width : at + 4;
          const rowIndex = rows.findIndex(row =>
            row.every(p => x + width + GAP <= p.x || x >= p.x + p.width + GAP));
          if (rowIndex === -1) continue;
          rows[rowIndex].push({ x, width });
          const y = bottom - ROWS[rowIndex];
          ctx.fillStyle = 'rgba(0,0,0,0.62)';
          ctx.fillRect(x - 3, y - LINE_H, width + 6, LINE_H + 3);
          ctx.fillStyle = `rgba(${MOD_ACCENT},1)`;
          ctx.fillText(text, x, y);
        }
        ctx.restore();
      },
    }],
  });

  // Shared sorted x-grid for the whole chart: every dataset is built from
  // snapshotData.map(s => ({x: s.x, ...})), so all data arrays share these x
  // values index-for-index. smoothYExtent binary-searches this once per frame to
  // bound its scan to the visible window instead of walking every series in full.
  currentChart.$xs = snapshotData.map(s => s.x);

  // Legend hook for the members line: the legend is built separately, so it
  // reads the same gate the dataset did.
  currentChart.$hasMembers = hasMembers;

  // Legend hooks for the (non-dataset) moderation overlay.
  currentChart.$hasModeration = moderation.length > 0;
  currentChart.$moderationVisible = () => showModeration;
  currentChart.$toggleModeration = () => {
    showModeration = !showModeration;
    try { localStorage.setItem('stream-chart-moderation', showModeration ? '1' : '0'); } catch (e) {}
    currentChart.draw();
    return showModeration;
  };

  // Double-click anywhere on the chart to reset an x-axis zoom/pan.
  ctx.ondblclick = () => {
    if (currentChart && currentChart.resetZoom) {
      if (currentChart.$stopZoomAnim) currentChart.$stopZoomAnim();
      currentChart.resetZoom('none');  // instant reset; afterDataLimits fits y to the (stale) window here
      currentChart.$xWindow = { min: currentChart.scales.x.min, max: currentChart.scales.x.max };
      currentChart.update('none');     // re-run smoothYFit against the restored full window so y refits too
      if (currentChart.$updateScrollbar) currentChart.$updateScrollbar();
    }
  };

  setupScrollbar();
}

// ── Scrub-and-zoom scrollbar ───────────────────────────────────────────────────
// A track under the chart whose thumb shows the visible x-window: drag the thumb
// body to scroll/pan, drag a handle to resize (zoom). Stays in sync with wheel
// zoom and chart panning via the zoom plugin's onZoom/onPan callbacks.
function setupScrollbar() {
  const track = document.getElementById('chartScrollbar');
  const thumb = document.getElementById('chartScrollbarThumb');
  if (!track || !thumb || !currentChart) return;

  const fullMin = currentChart.scales.x.min;
  const fullMax = currentChart.scales.x.max;
  const fullRange = (fullMax - fullMin) || 1;
  const minRange = fullRange * 0.02; // smallest window the thumb can shrink to
  currentChart.$xWindow = { min: fullMin, max: fullMax }; // smoothYFit reads this for the y-fit
  currentChart.$xFull = { min: fullMin, max: fullMax };   // captureView compares against this to detect a zoom


  function updateScrollbar() {
    const xs = currentChart.scales.x;
    let lo = Math.max(0, Math.min(1, (xs.min - fullMin) / fullRange));
    let hi = Math.max(0, Math.min(1, (xs.max - fullMin) / fullRange));
    thumb.style.left = (lo * 100) + '%';
    thumb.style.width = Math.max(0, (hi - lo) * 100) + '%';
  }

  function clampRange(min, max) {
    if (max - min < minRange) max = min + minRange;
    if (min < fullMin) { max += (fullMin - min); min = fullMin; }
    if (max > fullMax) { min -= (max - fullMax); max = fullMax; }
    return { min: Math.max(fullMin, min), max: Math.min(fullMax, max) };
  }

  // Instant apply -- used for resize (zoom) where immediate feedback feels best.
  function applyRange(min, max) {
    const r = clampRange(min, max);
    currentChart.$xWindow = { min: r.min, max: r.max };
    currentChart.zoomScale('x', r, 'none');
    updateScrollbar();
  }

  // Smoothed apply -- used for scrolling/panning. Drags are damped (less
  // sensitive) and the view eases toward the target instead of snapping.
  const PAN_SENSITIVITY = 0.6; // < 1 => view moves less than the cursor
  const PAN_SMOOTH = 0.5;      // fraction eased toward target per frame (higher => snappier, fewer full updates per gesture)
  const ZOOM_STEP = 0.0007;    // wheel-zoom sensitivity (smaller => less sensitive)
  let targetMin = null, targetMax = null, rafId = null;

  function animateToward() {
    if (!currentChart || !currentChart.scales || !currentChart.scales.x) { rafId = null; return; }
    const xs = currentChart.scales.x;
    let min = xs.min + (targetMin - xs.min) * PAN_SMOOTH;
    let max = xs.max + (targetMax - xs.max) * PAN_SMOOTH;
    const eps = fullRange * 0.0004;
    if (Math.abs(targetMin - min) < eps && Math.abs(targetMax - max) < eps) {
      min = targetMin; max = targetMax; rafId = null;
    } else {
      rafId = requestAnimationFrame(animateToward);
    }
    currentChart.$xWindow = { min, max };
    currentChart.zoomScale('x', { min, max }, 'none');
    updateScrollbar();
  }

  function smoothTo(min, max) {
    const r = clampRange(min, max);
    targetMin = r.min; targetMax = r.max;
    if (rafId == null) rafId = requestAnimationFrame(animateToward);
  }

  // Let the zoom plugin's callbacks refresh the thumb during wheel/drag on the chart.
  currentChart.$updateScrollbar = updateScrollbar;
  // Lets a live refresh put the user's zoom/pan window back (see restoreView).
  currentChart.$applyRange = applyRange;
  // Cancel any in-flight easing so a reset isn't fought by a pending animation.
  currentChart.$stopZoomAnim = () => {
    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
    targetMin = targetMax = null;
  };

  function startDrag(e, mode) {
    e.preventDefault();
    e.stopPropagation();
    const trackW = track.clientWidth || 1;
    const startX = e.touches ? e.touches[0].clientX : e.clientX;
    const startMin = currentChart.scales.x.min;
    const startMax = currentChart.scales.x.max;
    function onMove(ev) {
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const dxVal = ((cx - startX) / trackW) * fullRange;
      if (mode === 'pan')        smoothTo(startMin + dxVal * PAN_SENSITIVITY, startMax + dxVal * PAN_SENSITIVITY);
      else if (mode === 'left')  applyRange(Math.min(startMin + dxVal, startMax - minRange), startMax);
      else if (mode === 'right') applyRange(startMin, Math.max(startMax + dxVal, startMin + minRange));
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  thumb.addEventListener('mousedown', e => startDrag(e, 'pan'));
  thumb.addEventListener('touchstart', e => startDrag(e, 'pan'), { passive: false });
  const hLeft = thumb.querySelector('.chart-scrollbar-handle.left');
  const hRight = thumb.querySelector('.chart-scrollbar-handle.right');
  if (hLeft)  { hLeft.addEventListener('mousedown', e => startDrag(e, 'left'));   hLeft.addEventListener('touchstart', e => startDrag(e, 'left'), { passive: false }); }
  if (hRight) { hRight.addEventListener('mousedown', e => startDrag(e, 'right')); hRight.addEventListener('touchstart', e => startDrag(e, 'right'), { passive: false }); }

  // Click empty track to recenter the current window where you clicked.
  track.addEventListener('mousedown', e => {
    if (e.target !== track) return; // ignore clicks that land on the thumb/handles
    const rect = track.getBoundingClientRect();
    const frac = (e.clientX - rect.left) / (rect.width || 1);
    const xs = currentChart.scales.x;
    const half = (xs.max - xs.min) / 2;
    const center = fullMin + frac * fullRange;
    smoothTo(center - half, center + half);
  });

  // Eased, less-sensitive wheel zoom toward the cursor (replaces the plugin's
  // built-in wheel zoom, which is instant and steppy). Normalizes wheel delta
  // across devices, caps each step, then eases toward the target via smoothTo.
  const canvas = currentChart.canvas;
  if (canvas) {
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;        // line units -> approx pixels
      else if (e.deltaMode === 2) d *= 400;  // page units -> approx pixels
      d = Math.max(-80, Math.min(80, d));    // cap the per-event zoom step
      const factor = Math.exp(d * ZOOM_STEP); // >1 zoom out, <1 zoom in
      // Build on the in-flight target while animating so fast scrolls accumulate.
      const animating = rafId != null && targetMin != null;
      const baseMin = animating ? targetMin : currentChart.scales.x.min;
      const baseMax = animating ? targetMax : currentChart.scales.x.max;
      const area = currentChart.chartArea;
      const rect = canvas.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left - area.left) / ((area.right - area.left) || 1)));
      const cursor = baseMin + frac * (baseMax - baseMin);
      smoothTo(cursor - (cursor - baseMin) * factor, cursor + (baseMax - cursor) * factor);
    }, { passive: false });
  }

  updateScrollbar();
}

// ── Interactive legend ─────────────────────────────────────────────────────────
function buildLegend(hasYTViewers, hasDonations, hasActiveYT, hasYTChat) {
  const container = document.getElementById('chartLegend');
  if (!container || !currentChart) return;

  // Each entry of `groups` is one header-less column of items; empty columns are
  // dropped. An item appears only when buildChart drew its dataset.
  // Item: { label, type ('line'|'dashed'|'dotted'|'bar'), color, ds } or
  // { special:'moderation' }.
  const groups = [];

  // Money and heads. $hasMembers mirrors buildChart's dataset gate.
  const gMoney = [];
  if (hasDonations) gMoney.push({ label: 'Donations', type: 'line', color: '#e8c020', ds: DS.DONATIONS });
  if (currentChart.$hasMembers)
    gMoney.push({ label: 'Members', type: 'line', color: 'rgb(255,120,200)', ds: DS.MEMBERS });
  groups.push({ items: gMoney });

  // Audience.
  const gAudience = [];
  if (hasYTViewers) gAudience.push({ label: 'Viewers',         type: 'line',   color: '#40c4ff', ds: DS.YT_VIEWERS });
  if (hasActiveYT)  gAudience.push({ label: 'Active Chatters', type: 'dotted', color: '#909090', ds: DS.YT_ACTIVE_CHATTERS });
  if (hasYTChat)    gAudience.push({ label: 'Msg/Min',         type: 'dashed', color: '#82b1ff', ds: DS.YT_CHAT });
  groups.push({ items: gAudience });

  // The non-dataset moderation overlay toggle.
  const gOverlays = [];
  if (currentChart.$hasModeration) gOverlays.push({ special: 'moderation' });
  groups.push({ items: gOverlays });

  container.innerHTML = '';

  // One dataset toggle element (indicator + label + click-to-hide/persist).
  function makeItem(item) {
    const span = document.createElement('span');
    span.className = 'legend-item';
    span.dataset.ds = item.ds;

    let indicator;
    if (item.type === 'bar') {
      indicator = `<span class="legend-swatch" style="background:${item.color};"></span>`;
    } else if (item.type === 'dashed') {
      // Dashed line indicator: two short segments with a gap
      indicator = `<svg width="20" height="8" style="flex-shrink:0;"><line x1="0" y1="4" x2="7" y2="4" stroke="${item.color}" stroke-width="2"/><line x1="11" y1="4" x2="20" y2="4" stroke="${item.color}" stroke-width="2"/></svg>`;
    } else if (item.type === 'dotted') {
      // Dotted line indicator: matches the [2,2] dash on the active-chatter lines
      indicator = `<svg width="20" height="8" style="flex-shrink:0;"><line x1="0" y1="4" x2="20" y2="4" stroke="${item.color}" stroke-width="2" stroke-dasharray="2 2"/></svg>`;
    } else {
      indicator = `<span class="legend-line" style="background:${item.color};"></span>`;
    }

    span.innerHTML = `${indicator}${item.label}`;
    if (hiddenDatasets.has(item.ds)) span.classList.add('hidden');

    span.addEventListener('click', () => {
      const dsIndex = currentChart.data.datasets.findIndex(d => d.label === item.ds);
      if (dsIndex === -1) return;
      const nowVisible = currentChart.isDatasetVisible(dsIndex);
      currentChart.setDatasetVisibility(dsIndex, !nowVisible);
      span.classList.toggle('hidden', nowVisible);
      if (nowVisible) hiddenDatasets.add(item.ds);
      else hiddenDatasets.delete(item.ds);
      localStorage.setItem('stream-chart-hidden', JSON.stringify([...hiddenDatasets]));
      syncAxisDisplay();
    });

    return span;
  }

  // Non-dataset moderation overlay toggle: the same red as the marks.
  function makeModerationToggle() {
    const span = document.createElement('span');
    span.className = 'legend-item';
    // Square glyph, matching the square marker head the plugin draws.
    span.innerHTML = `Moderation <span style="color:rgba(${MOD_ACCENT},0.95);font-weight:bold;">&#9642;</span>`;
    if (!currentChart.$moderationVisible()) span.classList.add('hidden');
    span.addEventListener('click', () => {
      const visible = currentChart.$toggleModeration();
      span.classList.toggle('hidden', !visible);
    });
    return span;
  }

  // Render each non-empty category as a vertical column; columns sit side-by-side.
  for (const group of groups) {
    if (group.items.length === 0) continue;
    const col = document.createElement('div');
    col.className = 'legend-group';
    for (const item of group.items) {
      if (item.special === 'moderation') col.appendChild(makeModerationToggle());
      else                               col.appendChild(makeItem(item));
    }
    container.appendChild(col);
  }
}

// ── Chart header fit ───────────────────────────────────────────────────────────
// The title block sits absolutely at the header's top-left while the legend is
// centred, so a narrow panel slides the legend's first column under the title.
// When the two would meet, the header switches to a stacked layout (title row
// above the legend). The check measures the legend's columns rather than its
// container: column positions are identical in both layouts, so the result
// never flip-flops between them.
const CHART_HEADER_GAP = 16;
let chartHeaderWidth = -1;

function fitChartHeader(header, force) {
  if (!header || !header.isConnected) return;
  const width = header.clientWidth;
  if (!force && width === chartHeaderWidth) return;
  chartHeaderWidth = width;
  const titleWrap = header.querySelector('.chart-title-wrap');
  const groups = header.querySelectorAll('.legend-group');
  if (!titleWrap || groups.length === 0) return;
  const titleRight = titleWrap.getBoundingClientRect().right;
  let legendLeft = Infinity;
  groups.forEach(g => { legendLeft = Math.min(legendLeft, g.getBoundingClientRect().left); });
  header.classList.toggle('stacked', titleRight + CHART_HEADER_GAP > legendLeft);
}

// One observer, re-pointed at each newly rendered header. Toggling the class
// changes only the header's height, and the width guard above ignores that.
const chartHeaderObserver = (typeof ResizeObserver === 'function')
  ? new ResizeObserver(entries => fitChartHeader(entries[0].target, false))
  : null;

function watchChartHeader(header) {
  if (!header) return;
  fitChartHeader(header, true);
  if (chartHeaderObserver) {
    chartHeaderObserver.disconnect();
    chartHeaderObserver.observe(header);
  }
  // The Rye title font can land after the first measurement.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => fitChartHeader(header, true));
  }
}

// ── Wire up the sidebar search box (the input lives outside the rebuilt list, so
// this binds once and its value/focus survive timezone-switch rebuilds). ──
(function () {
  const searchInput = document.getElementById('streamSearch');
  if (!searchInput) return;
  let searchDebounce = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => applyFilter(searchInput.value), 120);
  });
})();

loadStreamList();
</script>
