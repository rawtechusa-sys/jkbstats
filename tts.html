<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Standalone guard: these pages are meant to live inside the index.html shell
     (which owns the tabs, theme and background). If loaded top-level, bounce into
     the shell at this page's tab, carrying any deep-link sub-slug. -->
<script>(function(){
  if (window.self !== window.top) return;            // embedded in the shell -> normal
  var slug = 'tts';
  var sub  = location.hash.replace(/^#/, '');
  location.replace('index.html#' + slug + (sub ? '/' + sub : ''));
})();</script>
<title>TTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Lora:ital,wght@0,400;0,500;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link id="theme-css" rel="stylesheet" href="themes/goblin-cave.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    color: var(--text-primary);
    font-family: 'Lora', serif;
    font-size: 16px;
    line-height: 1.6;
    overflow: hidden;
  }

  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 16px;
  }

  /* ── Title row ─────────────────────────────────────────────── */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }

  .page-title {
    font-family: 'Rye', serif;
    font-size: 20px;
    color: var(--accent-bright);
    letter-spacing: 0.06em;
  }

  .title-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* Shared small-button look (matches the donor trigger) */
  .btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--bg-panel);
    color: var(--text-muted);
    border: 1px solid var(--border-default-strong);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  .card-controls { display: flex; gap: 6px; }

  /* Voices | Sounds mode toggle, the active mode's totals, and the tts.monster link */
  .mode-toggle { display: flex; gap: 4px; }
  .btn.is-on {
    border-color: var(--accent);
    color: var(--accent-bright);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.12);
  }
  .mode-summary, .monster-link {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .monster-link { text-decoration: none; border-bottom: 1px dotted var(--border-default-strong); }
  .monster-link:hover { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }

  /* ── Donor dropdown ────────────────────────────────────────── */
  .donor-dropdown { position: relative; flex-shrink: 0; }

  .donor-trigger {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--bg-panel);
    color: var(--text-muted);
    border: 1px solid var(--border-default-strong);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .donor-trigger:hover { border-color: var(--accent); color: var(--accent-bright); }
  .donor-trigger .caret { margin-left: 6px; opacity: 0.7; }

  .donor-panel {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 10;
    width: 240px;
    max-height: 320px;
    overflow-y: auto;
    background: var(--bg-surface);
    border: 1px solid var(--border-default-strong);
    border-radius: 6px;
    padding: 4px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .donor-panel.open { display: block; }
  .donor-panel::-webkit-scrollbar { width: 4px; }
  .donor-panel::-webkit-scrollbar-track { background: transparent; }
  .donor-panel::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  .donor-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }
  .donor-opt:hover { background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.06); }
  .donor-opt input { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .donor-opt .count { margin-left: auto; color: var(--text-muted); font-size: 11px; }
  .donor-opt.all {
    border-bottom: 1px solid var(--border-default);
    margin-bottom: 4px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .donor-opt.all .all-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .donor-invert {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-default-strong);
    border-radius: 3px;
    padding: 2px 7px;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .donor-invert:hover { border-color: var(--accent); color: var(--accent-bright); }

  /* ── Scroll section (cards + list share one scrollbar) ─────── */
  .scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-right: 4px;
  }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }

  /* ── Cards ─────────────────────────────────────────────────── */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex-shrink: 0;
    align-items: flex-start;   /* cards size to their own content, top-aligned */
  }

  .tts-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
    min-width: 130px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-align: center;
    transition: border-color 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    opacity: 0.4;
  }
  .tts-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 2;
  }
  .tts-card:hover { border-color: var(--border-default-strong); }
  .tts-card.active {
    opacity: 1;
    border-color: var(--accent);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.06);
  }
  .tts-card.active::before { opacity: 0.5; }

  /* Background image layer: fills the card (cover), sits behind text at 50% brightness */
  .tts-card .card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: brightness(0.5);
    z-index: 0;
    display: none;          /* shown only once an image actually loads */
  }
  .tts-card.has-bg .card-bg { display: block; }

  /* White (Onion Layers) theme: text on cards is dark, so lighten the image
     instead of darkening it, and swap the dark text halos for light ones. */
  html[data-theme="white"] .tts-card .card-bg { filter: brightness(1.6); opacity: 0.5; }
  /* Light scrim over the faded image so dark text always has a readable base,
     even on dark source artwork. */
  html[data-theme="white"] .tts-card.has-bg .card-content::before {
    content: '';
    position: absolute;
    inset: -8px -10px;
    background: radial-gradient(ellipse at center, rgba(251,247,238,0.82) 0%, rgba(251,247,238,0.55) 70%, transparent 100%);
    z-index: -1;
    pointer-events: none;
  }
  html[data-theme="white"] .tts-card .voice {
    text-shadow: 0 1px 2px rgba(255,250,240,1), 0 0 10px rgba(255,250,240,0.9);
  }
  html[data-theme="white"] .tts-card .summary {
    text-shadow: 0 1px 2px rgba(255,250,240,1), 0 0 6px rgba(255,250,240,0.85);
  }

  /* Text layer above the image */
  .tts-card .card-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    transition: padding 0.2s ease;
  }

  .tts-card .voice {
    font-family: 'Rye', serif;
    font-size: 22px;
    color: var(--accent-bright);
    display: block;
    line-height: 1.1;
    text-shadow: 0 0 12px rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.3),
                 0 1px 3px rgba(0,0,0,0.8);
    word-break: break-word;
    flex-shrink: 0;
    transition: font-size 0.2s ease;
  }
  .tts-card .summary {
    margin-top: 6px;
    max-width: 240px;       /* let long descriptions wrap instead of stretching the card */
    max-height: 320px;
    overflow: hidden;
    font-family: 'Lora', serif;
    font-size: 12px;
    line-height: 1.35;
    color: var(--text-primary);
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    transition: max-height 0.2s ease, max-width 0.2s ease, opacity 0.2s ease, margin-top 0.2s ease;
  }
  /* Deselected cards collapse — both the description and their overall width. */
  .tts-card:not(.active) { min-width: 0; }
  .tts-card:not(.active) .card-content { padding: 8px 11px; }
  .tts-card:not(.active) .voice { font-size: 15px; }
  .tts-card:not(.active) .summary {
    max-height: 0;
    max-width: 0;        /* so the collapsed description no longer dictates card width */
    opacity: 0;
    margin-top: 0;
  }
  .tts-card:not(.active) .uses { font-size: 10px; margin-top: 3px; }
  .tts-card .summary a { color: var(--accent-bright); text-decoration: underline; }
  .tts-card .summary a:hover { color: var(--text-primary); }
  .tts-card .uses {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: block;
    margin-top: 6px;
    flex-shrink: 0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    transition: font-size 0.2s ease, margin-top 0.2s ease;
  }

  /* ── Message list ──────────────────────────────────────────── */
  .list-wrap {
    flex-shrink: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border-default);
    border-radius: 6px;
  }

  .msg {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(100,180,60,0.06);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .msg:last-child { border-bottom: none; }
  .msg:hover { background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.04); }

  .msg-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .msg-user {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-primary);
  }
  .cmd-badge {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.35);
    color: var(--accent-bright);
    background: rgba(var(--accent-glow-r),var(--accent-glow-g),var(--accent-glow-b),0.12);
  }
  /* Sound effects "(code)" read as a dashed pill; voices "name:" keep the accent box. */
  .cmd-badge.snd {
    border-radius: 10px;
    border: 1px dashed var(--border-default-strong);
    color: var(--text-primary);
    background: var(--bg-subtle);
  }
  .cmd-badge.off { opacity: 0.3; }

  .msg-text {
    font-size: 14px;
    color: var(--text-primary);
    word-break: break-word;
  }
  .msg-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .msg-meta a { color: var(--text-muted); text-decoration: none; }
  .msg-meta a:hover { color: var(--accent-bright); }
  .vod-link::before { content: '▶ '; }

  .loading-state, .empty-state, .error-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 12px;
    color: var(--text-muted);
    font-style: italic;
  }
  .loading-glyph {
    font-family: 'Rye', serif;
    font-size: 32px;
    color: var(--accent);
    animation: flicker 2s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.6; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="title-row">
    <div class="title-left">
      <div class="page-title">TTS · Cave Echoes</div>
      <div class="mode-toggle" id="modeToggle" style="display:none;">
        <button class="btn" data-mode="voices">Voices</button>
        <button class="btn" data-mode="sounds">Sounds</button>
      </div>
      <div class="card-controls" id="cardControls" style="display:none;">
        <button class="btn" id="selAll">Select All</button>
        <button class="btn" id="selNone">Select None</button>
        <button class="btn" id="selInvert">Invert Selection</button>
      </div>
      <span class="mode-summary" id="modeSummary"></span>
      <a class="monster-link" id="monsterLink" href="https://tts.monster/yt/UCnWhLFvHOCXs3Zzf5Tl-j1w"
         target="_blank" rel="noopener noreferrer">voice &amp; sound list</a>
    </div>
    <div class="donor-dropdown" id="donorDropdown" style="display:none;">
      <button class="donor-trigger" id="donorTrigger">
        <span id="donorLabel">All donors</span><span class="caret">▾</span>
      </button>
      <div class="donor-panel" id="donorPanel"></div>
    </div>
  </div>

  <div class="scroll-area">
    <div class="cards" id="cards"></div>

    <div class="list-wrap" id="listWrap">
      <div class="loading-state">
        <span class="loading-glyph">~</span>
        <span>listening at the cave mouth...</span>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>

<script>
const RAW = DATA_BASE;   // config.js: raw.githubusercontent in production, local files on localhost

// ── Theme (mirrors donors.html / streams.html) ───────────────────────────────
function applyTheme(key) {
  const themes = {
    green: 'themes/goblin-cave.css',
    amber: 'themes/hearth-fire.css',
    grey:  'themes/misty-mountain.css',
    void:  'themes/deep-mine.css',
    white: 'themes/the-shire.css',
  };
  document.getElementById('theme-css').href = themes[key] || themes.green;
  document.documentElement.setAttribute('data-theme', key);
}
applyTheme(localStorage.getItem('goblin-theme') || 'green');
window.addEventListener('message', e => {
  if (e.data?.type === 'theme') applyTheme(e.data.key);
  else if (e.data?.type === 'timezone' && DATA) renderMessages();   // live timezone switch
});

// Mouse forwarding so the parent's roach/eye animations still react.
document.addEventListener('mousemove', e => {
  try { window.parent.postMessage({ type: 'mousemove', x: e.clientX, y: e.clientY }, '*'); } catch(err) {}
});
document.addEventListener('mouseleave', () => {
  try { window.parent.postMessage({ type: 'mouseleave' }, '*'); } catch(err) {}
});

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} — ${url}`);
  return r.json();
}
async function fetchText(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} — ${url}`);
  return r.text();
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Minimal inline markdown ──────────────────────────────────────────────────
// Supports [text](url), **bold**, __underline__, *italic*. Input is HTML-escaped
// first, so the only tags that survive are the ones we emit here.
function mdInline(src) {
  let s = escHtml(src);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
    const safe = /^(https?:|mailto:)/i.test(url) ? url : '#';
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');   // bold (before italic)
  s = s.replace(/__([^_]+)__/g, '<u>$1</u>');                 // underline
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');               // italic
  return s;
}

// Parse "Name: description" lines into { lowercasedName: {name, desc} }.
function parseDescriptions(text) {
  const map = {};
  for (const raw of (text || '').split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const idx = line.indexOf(':');
    if (idx === -1) continue;
    const name = line.slice(0, idx).trim();
    const desc = line.slice(idx + 1).trim();
    if (!name) continue;
    map[name.toLowerCase()] = { name, desc };
  }
  return map;
}

// Find a background image for a card by trying name-casing variants × common
// web image extensions; sets it on the card once one loads (filenames are
// case-sensitive on GitHub raw / most static hosts, so we try a few spellings).
// Card art is optional: only names listed in tts-backgrounds/index.json (a JSON
// array of voice names / sound codes) are probed, so a site with no art costs
// one request instead of dozens of 404s per card.
const BG_EXTS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'avif'];
let BG_NAMES = new Set();      // lowercased names that have card art
function loadCardBackground(cardEl, voice, canonicalName) {
  const cap = voice.charAt(0).toUpperCase() + voice.slice(1);
  const names = [...new Set([canonicalName, cap, voice, voice.toUpperCase()].filter(Boolean))];
  const candidates = [];
  for (const n of names) for (const e of BG_EXTS) candidates.push(`${RAW}/tts-backgrounds/${encodeURIComponent(n)}.${e}`);

  let i = 0;
  const tryNext = () => {
    if (i >= candidates.length) return;
    const url = candidates[i++];
    const img = new Image();
    img.onload = () => {
      const layer = cardEl.querySelector('.card-bg');
      if (layer) layer.style.backgroundImage = `url("${url}")`;
      cardEl.classList.add('has-bg');
    };
    img.onerror = tryNext;
    img.src = url;
  };
  tryNext();
}

// ── State ────────────────────────────────────────────────────────────────────
let DATA         = null;       // the loaded tts.json
let MODE         = 'sounds';   // active mode, a key of MODES
let enabled      = new Set();  // toggled-on names of the active mode (= ENABLED[MODE])
let donors       = [];         // [{name, count}], sorted by count desc
let selected     = new Set();  // currently selected donor names
let DESCRIPTIONS = {};         // { lowercasedName: {name, desc} }

// ── Modes ────────────────────────────────────────────────────────────────────
// tts.monster messages carry two kinds of token: voices ("name: text") and sound
// effects ("(code)"). One card grid / message list serves both. A mode names the
// tts.json field that holds its counts (DATA[key]) and its per-message array
// (m[key]), its whitelist file, and how a token is written in chat.
const MODES = {
  voices: { key: 'commands', file: 'tts-voices.txt', one: 'voice', many: 'voices', token: n => `${n}:`  },
  sounds: { key: 'sounds',   file: 'tts-sounds.txt', one: 'sound', many: 'sounds', token: n => `(${n})` },
};
const MODE_KEY     = 'goblin-tts-mode';
const NAMES        = { voices: {}, sounds: {} };                 // per mode: { lowercased: canonical } whitelist
const WHITELIST_ON = { voices: false, sounds: false };           // true once that mode's list loads with ≥1 entry
const ENABLED      = { voices: new Set(), sounds: new Set() };   // per mode: toggled-on names (survives a mode switch)

function setEnabled(set) { ENABLED[MODE] = enabled = set; }

// Parse a whitelist file (one name per line) into { lowercased: canonical }.
function parseNames(text) {
  const map = {};
  for (const raw of (text || '').split(/\r?\n/)) {
    const name = raw.trim();
    if (!name || name.startsWith('#')) continue;
    map[name.toLowerCase()] = name;
  }
  return map;
}

// A token counts as a real voice / sound only if it's whitelisted (or, as a safety
// fallback, if the whitelist failed to load so we don't hide everything).
// NB: takes a mode, so never pass it bare to .some()/.filter() (index -> mode).
function isKnown(c, mode = MODE) {
  return !WHITELIST_ON[mode] || Object.prototype.hasOwnProperty.call(NAMES[mode], String(c).toLowerCase());
}

// Display name: whitelist first (covers every entry), then the descriptions
// file, else capitalize a voice / leave a sound code as typed.
function displayName(name, mode = MODE) {
  const lc = name.toLowerCase();
  const info = DESCRIPTIONS[lc];
  return NAMES[mode][lc] || (info && info.name)
      || (mode === 'voices' ? name.charAt(0).toUpperCase() + name.slice(1) : name);
}

// The active mode's [name, count] pairs: whitelisted only, most-used first.
function modeCounts() {
  return Object.entries(DATA[MODES[MODE].key] || {})
    .filter(([name]) => isKnown(name))
    .sort((a, b) => b[1] - a[1]);
}

// "N sounds · M uses" for the active mode, next to the toggle.
function renderSummary() {
  const M = MODES[MODE];
  const counts = modeCounts();
  const uses = counts.reduce((sum, [, n]) => sum + n, 0);
  document.getElementById('modeSummary').textContent =
    `${counts.length} ${counts.length === 1 ? M.one : M.many} · ${uses} use${uses === 1 ? '' : 's'}`;
}

// ── Cards ────────────────────────────────────────────────────────────────────
function renderCards() {
  const el = document.getElementById('cards');
  const cmds = modeCounts();

  if (!cmds.length) { el.innerHTML = ''; return; }

  el.innerHTML = cmds.map(([voice, count]) => {
    const on = enabled.has(voice);
    const info = DESCRIPTIONS[voice.toLowerCase()];
    const summary = info && info.desc
      ? `<div class="summary">${mdInline(info.desc)}</div>`
      : '';
    return `<div class="tts-card${on ? ' active' : ''}" data-voice="${escHtml(voice)}">
      <div class="card-bg"></div>
      <div class="card-content">
        <span class="voice">${escHtml(displayName(voice))}</span>
        ${summary}
        <span class="uses">${count} use${count === 1 ? '' : 's'}</span>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.tts-card').forEach(card => {
    const voice = card.dataset.voice;
    if (BG_NAMES.has(voice.toLowerCase())) loadCardBackground(card, voice, displayName(voice));

    card.addEventListener('click', e => {
      // Let links inside the summary work without toggling the card.
      if (e.target.closest('a')) return;
      if (enabled.has(voice)) enabled.delete(voice); else enabled.add(voice);
      card.classList.toggle('active', enabled.has(voice));
      renderMessages();
    });
  });
}

// Toggle .active on existing cards without rebuilding them (avoids reloading
// the background images on every Select All / None / Invert).
function syncCardClasses() {
  document.querySelectorAll('#cards .tts-card').forEach(card => {
    card.classList.toggle('active', enabled.has(card.dataset.voice));
  });
}

// ── Card selection controls ──────────────────────────────────────────────────
function wireCardControls() {
  document.getElementById('cardControls').style.display = '';
  const allNames = () => modeCounts().map(([name]) => name);

  document.getElementById('selAll').addEventListener('click', () => {
    setEnabled(new Set(allNames()));
    syncCardClasses();
    renderMessages();
  });
  document.getElementById('selNone').addEventListener('click', () => {
    setEnabled(new Set());
    syncCardClasses();
    renderMessages();
  });
  document.getElementById('selInvert').addEventListener('click', () => {
    setEnabled(new Set(allNames().filter(v => !enabled.has(v))));
    syncCardClasses();
    renderMessages();
  });
}

// ── Mode toggle (Voices | Sounds) ────────────────────────────────────────────
// Switch the whole page to a mode: cards, summary, donor counts and the message
// filter all follow. `persist` is false for the initial load and for the automatic
// switch in selectTtsDonor, so only a real click is remembered.
function setMode(mode, persist) {
  if (!MODES[mode]) return;
  MODE = mode;
  enabled = ENABLED[mode];
  if (persist) { try { localStorage.setItem(MODE_KEY, mode); } catch (e) {} }
  document.querySelectorAll('#modeToggle .btn').forEach(b =>
    b.classList.toggle('is-on', b.dataset.mode === mode));
  buildDonors();
  renderCards();
  renderSummary();
  renderDonorPanel();
  updateDonorLabel();
  renderMessages();
}

function wireModeToggle() {
  const el = document.getElementById('modeToggle');
  el.style.display = '';
  el.querySelectorAll('.btn').forEach(b =>
    b.addEventListener('click', () => { if (b.dataset.mode !== MODE) setMode(b.dataset.mode, true); }));
}

// ── Donor dropdown ───────────────────────────────────────────────────────────
// Donors (and their message counts) of the active mode. A narrowed selection
// carries over a mode switch; "all" (the default) stays "all", and a selection
// that would come out empty in the new mode falls back to all.
function buildDonors() {
  const key = MODES[MODE].key;
  const wasAll = selected.size === donors.length;   // also true on the first build (0 === 0)
  const counts = {};
  for (const m of DATA.messages || []) {
    if (!(m[key] || []).some(c => isKnown(c))) continue;   // no real voice / sound of this mode
    counts[m.username] = (counts[m.username] || 0) + 1;
  }
  donors = Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  const kept = donors.filter(d => wasAll || selected.has(d.name));
  selected = new Set((kept.length ? kept : donors).map(d => d.name));
}

// Focus a single donor (e.g. arrived from a donors.html "TTS Messages" link).
// Donor keys keep a leading '@'; the incoming username may not, so match on the
// '@'-stripped lowercased form. A donor with nothing in the active mode is looked
// up in the other one (that link counts both). No match -> leave all selected.
function selectTtsDonor(user) {
  const u = String(user || '').replace(/^@+/, '').toLowerCase();
  if (!u) return;
  const find = () => donors.find(x => x.name.replace(/^@+/, '').toLowerCase() === u);
  let d = find();
  if (!d) {
    const back = MODE;
    setMode(back === 'sounds' ? 'voices' : 'sounds', false);
    d = find();
    if (!d) { setMode(back, false); return; }
  }
  selected = new Set([d.name]);
  renderDonorPanel();
  updateDonorLabel();
  renderMessages();
}

function updateDonorLabel() {
  const label = document.getElementById('donorLabel');
  if (selected.size === donors.length) label.textContent = 'All donors';
  else if (selected.size === 0)        label.textContent = 'No donors';
  else if (selected.size === 1)        label.textContent = [...selected][0];
  else                                 label.textContent = `${selected.size} donors`;
}

function renderDonorPanel() {
  const panel = document.getElementById('donorPanel');
  const allChecked = selected.size === donors.length;
  const opts = donors.map(d => `
    <label class="donor-opt">
      <input type="checkbox" data-donor="${escHtml(d.name)}" ${selected.has(d.name) ? 'checked' : ''}>
      <span>${escHtml(d.name)}</span><span class="count">${d.count}</span>
    </label>`).join('');

  panel.innerHTML = `
    <div class="donor-opt all">
      <label class="all-check">
        <input type="checkbox" id="donorAll" ${allChecked ? 'checked' : ''}>
        <span>All</span>
      </label>
      <button type="button" class="donor-invert" id="donorInvert">Invert</button>
    </div>${opts}`;

  panel.querySelector('#donorAll').addEventListener('change', e => {
    if (e.target.checked) selected = new Set(donors.map(d => d.name));
    else selected = new Set();
    renderDonorPanel();
    updateDonorLabel();
    renderMessages();
  });

  panel.querySelector('#donorInvert').addEventListener('click', e => {
    e.stopPropagation();
    selected = new Set(donors.filter(d => !selected.has(d.name)).map(d => d.name));
    renderDonorPanel();
    updateDonorLabel();
    renderMessages();
  });

  panel.querySelectorAll('input[data-donor]').forEach(cb => {
    cb.addEventListener('change', () => {
      const name = cb.dataset.donor;
      if (cb.checked) selected.add(name); else selected.delete(name);
      // Keep the "All" box in sync without rebuilding the whole list.
      panel.querySelector('#donorAll').checked = selected.size === donors.length;
      updateDonorLabel();
      renderMessages();
    });
  });
}

function wireDonorDropdown() {
  const dd = document.getElementById('donorDropdown');
  const trigger = document.getElementById('donorTrigger');
  const panel = document.getElementById('donorPanel');
  dd.style.display = '';
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!dd.contains(e.target)) panel.classList.remove('open');
  });
  renderDonorPanel();
  updateDonorLabel();
}

// ── Message list ─────────────────────────────────────────────────────────────
// The stream name links across to its per-stream view on streams.html
// (deep-linked by slug, mirroring donors.html).
function streamLink(streamId) {
  const s = (DATA.streams || {})[streamId] || {};
  const label = s.title || streamId;
  if (!streamId) return `<span>${escHtml(label)}</span>`;
  return `<a href="streams.html#${encodeURIComponent(streamId)}" target="_blank" rel="noopener noreferrer" title="${escHtml(label)}">${escHtml(label)}</a>`;
}

// ── VOD timestamp deep links ─────────────────────────────────────────────────
// Each message links to the moment it fired in the stream's own YouTube VOD
// (streams[stream_id].source_vod_id), using ts - start_ts as the offset.
function fmtElapsed(startTs, ts) {
  const s = Math.max(0, Math.floor(ts - startTs));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

// Timestamp span: elapsed H:MM:SS into the stream, linking into the VOD when the
// stream has one; plain text otherwise.
function tsLink(m) {
  const s = (DATA.streams || {})[m.stream_id] || {};
  const startTs = s.start_ts;
  if (startTs == null || m.ts == null) return '';
  const label = fmtElapsed(startTs, m.ts);
  if (!s.source_vod_id) return `<span>${label}</span>`;
  const tSec = Math.max(0, Math.floor(m.ts - startTs));
  const href = `https://www.youtube.com/watch?v=${encodeURIComponent(s.source_vod_id)}&amp;t=${tSec}s`;
  return `<a class="vod-link" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}

function fmtDate(ts) {
  if (ts == null) return '';
  try { return new Date(ts * 1000).toLocaleDateString('en-US', withTZ({ year: 'numeric', month: 'short', day: 'numeric' })); }
  catch { return ''; }
}

function renderMessages() {
  const wrap = document.getElementById('listWrap');
  const key = MODES[MODE].key;
  const msgs = (DATA.messages || []).filter(m =>
    (m[key] || []).some(c => enabled.has(c)) && selected.has(m.username)
  );

  if (!msgs.length) {
    const why = modeCounts().length
      ? 'the cave is quiet — no messages match the current filters'
      : `no ${MODES[MODE].many} recorded yet`;
    wrap.innerHTML = `<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span><span>${why}</span></div>`;
    return;
  }

  wrap.innerHTML = msgs.map(m => {
    // Every message shows both kinds: voices as "name:", sounds as "(code)".
    // Only the active mode's badges dim, since only that mode filters the list.
    const badges = Object.keys(MODES).map(mode =>
      (m[MODES[mode].key] || []).filter(c => isKnown(c, mode)).map(c =>
        `<span class="cmd-badge${mode === 'sounds' ? ' snd' : ''}${mode === MODE && !enabled.has(c) ? ' off' : ''}">${escHtml(MODES[mode].token(displayName(c, mode)))}</span>`
      ).join('')
    ).join('');
    const meta = [
      streamLink(m.stream_id),
      fmtDate(m.ts) ? `<span>${fmtDate(m.ts)}</span>` : '',
      tsLink(m),
    ].filter(Boolean).join('<span style="opacity:0.4;">·</span>');

    return `<div class="msg">
      <div class="msg-head">
        <span class="msg-user">${escHtml(m.username)}</span>
        ${badges}
      </div>
      <div class="msg-text">${escHtml(m.message)}</div>
      <div class="msg-meta">${meta}</div>
    </div>`;
  }).join('');
}

// ── Load ─────────────────────────────────────────────────────────────────────
async function load() {
  const wrap = document.getElementById('listWrap');
  try {
    DATA = await fetchJSON(`${RAW}/data/tts.json`);

    const modeKeys = Object.keys(MODES);
    const hasData = mode => Object.keys(DATA[MODES[mode].key] || {}).length > 0;
    if (!modeKeys.some(hasData)) {
      document.getElementById('cards').innerHTML = '';
      wrap.innerHTML = '<div class="empty-state"><span class="loading-glyph" style="font-size:40px;">☽</span><span>no TTS voices or sounds recorded yet</span></div>';
      return;
    }

    // Descriptions, card art and the whitelists are all optional — load them
    // best-effort (in parallel) so a missing file never breaks the page.
    const [desc, bgNames, ...lists] = await Promise.all([
      fetchText(`${RAW}/tts-descriptions.md`).catch(() => ''),
      fetchJSON(`${RAW}/tts-backgrounds/index.json`).catch(() => []),
      ...modeKeys.map(mode => fetchText(`${RAW}/${MODES[mode].file}`).catch(() => '')),
    ]);
    DESCRIPTIONS = parseDescriptions(desc);
    BG_NAMES = new Set((Array.isArray(bgNames) ? bgNames : []).map(n => String(n).toLowerCase()));
    modeKeys.forEach((mode, i) => {
      NAMES[mode] = parseNames(lists[i]);
      WHITELIST_ON[mode] = Object.keys(NAMES[mode]).length > 0;
      // default: every (whitelisted) voice / sound on
      ENABLED[mode] = new Set(Object.keys(DATA[MODES[mode].key] || {}).filter(c => isKnown(c, mode)));
    });

    // Remembered mode, else sounds (what this audience uses most) — unless that
    // default has nothing recorded yet and the other mode does.
    let stored = null;
    try { stored = localStorage.getItem(MODE_KEY); } catch (e) {}
    let mode = MODES[stored] ? stored : 'sounds';
    if (!MODES[stored] && !hasData(mode)) mode = modeKeys.find(hasData) || mode;

    document.getElementById('monsterLink').title = `every voice and sound effect ${CHANNEL_NAME}'s tts.monster understands`;
    wireCardControls();
    wireDonorDropdown();
    wireModeToggle();
    setMode(mode, false);   // builds donors, cards, summary and the message list

    // A donors.html "TTS Messages" link stashes the donor here; consume it once
    // so a later manual visit doesn't stay filtered to that donor.
    let sel = null;
    try { sel = sessionStorage.getItem('selected-tts-user'); sessionStorage.removeItem('selected-tts-user'); } catch (e) {}
    if (sel) selectTtsDonor(sel);

  } catch (e) {
    wrap.innerHTML = `<div class="error-state"><span class="loading-glyph">✕</span><span>couldn't load TTS data<br><small>${escHtml(e.message)}</small></span></div>`;
  }
}

load();
</script>
</body>
</html>
